name: Performance Smoke Test

on: pull_request

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code and files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JMeter
        run: |
          wget https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run smoke test (2 users, short run)
        run: |
          apache-jmeter-5.6.3/bin/jmeter -n -t Demo_002.jmx -l smoke-result.jtl \
            -Jthreads=2 -Jrampup=2 -Jloops=1

      - name: Quick sanity check
        run: |
          total=$(tail -n +2 smoke-result.jtl | wc -l)
          failed=$(tail -n +2 smoke-result.jtl | awk -F',' '$8=="false"' | wc -l)
          echo "Smoke test: $total requests, $failed failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::Smoke test had failures — something is broken"
            exit 1
          fi
          echo "Smoke test passed — safe to review this PR"
